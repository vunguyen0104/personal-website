<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" role="img" aria-label="Signage plate reserved for a photograph">
  <rect width="400" height="480" fill="#16293D"/>

  <!-- Routed enamel frame -->
  <rect x="16" y="16" width="368" height="448" fill="none" stroke="#2c435c" stroke-width="2"/>
  <rect x="26" y="26" width="348" height="428" fill="none" stroke="#24384f" stroke-width="1"/>

  <!-- Four-line interchange schematic: the page's own route colours.
       No <text> here on purpose — an SVG loaded through <img src> is an isolated
       document and cannot reach the page's webfonts, so any lettering would fall
       back to the platform sans. The label is set in HTML over the plate instead. -->
  <g stroke-width="9" stroke-linecap="round" fill="none">
    <path d="M142 150V330" stroke="#C8102E"/>
    <path d="M181 150V330" stroke="#D96D00"/>
    <path d="M220 150V330" stroke="#00693E"/>
    <path d="M259 150V330" stroke="#1268C3"/>
  </g>

  <g fill="#16293D" stroke="#E6E5E0" stroke-width="5">
    <circle cx="142" cy="240" r="10"/>
    <circle cx="181" cy="240" r="10"/>
    <circle cx="220" cy="240" r="10"/>
    <circle cx="259" cy="240" r="10"/>
  </g>
</svg>
